# Matrix 2A -- sharding strategy, 8 GPUs, 8192 tok/GPU/step.
#
# Rows ddp -> zero1 -> zero2 -> zero3 decompose ZeRO's cost: optimizer state,
# then gradients, then parameters. zero3-hpz4 and zero3-hpz2 then vary *only*
# the param-gather scope against flat zero3.
#
# Budget: 9 cells, ~40 min.
# Narrow start: --only ddp zero3__ zero3-hpz4 zero3-hpz2  (~20 min).
#
# Result, 2026-08-15: the param-gather scope rows are answered and the answer is
# no. zero3-hpz2 and zero3-hpz4 both measured *slower* than flat zero3, in every
# cell of 2A, 2B and 2C, while costing +3.2 and +1.6 GB (so the feature was
# live, correctly sized, and simply not worth it). The gap that matters instead
# is between backends: fsdp-full moves the same bytes as zero3 for a third of
# the exposed time, and beats zero1/zero2, which communicate strictly less. Two
# thirds of flat ZeRO-3's cost here is not the fabric.

# Data is the real corpus with `wrapped` packing (config.py defaults), so the
# 8192 below is the literal token count, not a nominal one. report.py fails the
# cell if the measured count drifts from it.

defaults:
  seq_len: 4096
  micro_batch: 2          # 2 x 4096 = 8192 tok/GPU/step, the pinned control
  grad_accum: 1
  warmup_steps: 20
  measure_steps: 80

placements: [full]

strategies:
  - ddp                   # compute ceiling / denominator
  # DeepSpeed with ZeRO off, added as a candidate replacement denominator and
  # REJECTED on measurement (2026-08-15): 1.316 s p50, slower than zero1's
  # 1.196 despite sharding less, because stage-0's BF16_Optimizer all-reduces
  # gradients *and* all-gathers params (~3P vs ZeRO-1's ~2P). It also missed
  # the reference loss curve by 0.1831. Kept as the standing evidence that the
  # denominator cannot be repaired this way -- check_baseline_candidates
  # re-derives the verdict on every report, which is what makes it worth the
  # ~4 minutes after a DeepSpeed upgrade.
  - zero0
  - zero1
  - zero2
  - zero3                 # current baseline, flat
  - zero3-hpz4            # node-local gather
  - zero3-hpz2            # pair-local (NVLink) gather
  - fsdp-full             # cross-check vs zero3
  # `fsdp-hybrid` was here (cross-check vs zero3-hpz4) and was dropped
  # 2026-08-15: accelerate 1.14 ignored `fsdp_shard_size` under fsdp_version 2,
  # so the cell ran FULL_SHARD twice -- peak memory came back identical to
  # fsdp-full's, where a node-local replica has to cost GB. See strategies.py.
  # TP inside the NVLink pair. ZeRO-2 rather than the planned ZeRO-3 because
  # deepspeed 0.19.2 asserts autotp is incompatible with stage 3; TP already
  # keeps params sharded in-pair, so stage 3 had no param gather left to
  # optimize here. Reads against zero2 above as a single-variable comparison.
  - tp2-zero2
