# Matrix 2C -- tokens/GPU crossover. Where does comm stop mattering?
#
# The most durable output of the whole study: a portable cluster
# characteristic that transfers to models nobody has benchmarked yet.
#
# Note on the 2048 cell: micro_batch must be >= 1, so 2048 tok/GPU/step is
# unreachable at seq_len 4096. That cell drops to seq_len 2048 with
# micro_batch 1. It is therefore the one point on the curve where sequence
# length -- and so attention's quadratic term -- also changes; read it as
# indicative rather than as a clean single-variable step.
#
# Budget: 15 cells, ~1.5 hr. Edit `strategies` after reading 2A.

defaults:
  warmup_steps: 20
  measure_steps: 80

# Strategies, revised 2026-08-15 after reading 2A. Was ddp/zero3/zero3-hpz2.
#
# zero3-hpz2 is out: it measured slower than flat zero3 at all five token
# counts. fsdp-full is in, and it is the interesting curve now -- the first
# pass found ~0.44 s/step of exposed cost under zero3 that is flat from 2048 to
# 8192 tok/GPU and then collapses (0.195 s at 16384, 0.094 s at 32768), but
# fsdp-full moves the same bytes for 0.154 s at 8192. Whether the crossover
# lands at the same place for a backend that is not paying DeepSpeed's stage-3
# runtime cost is the question this matrix now exists to answer, and it decides
# whether the crossover is a property of the cluster or of DeepSpeed.
strategies:
  - ddp
  - zero3
  - fsdp-full

placements: [full]

tokens_per_gpu:
  - {seq_len: 2048, tokens_per_gpu: 2048}    # micro_batch 1, see note above
  - {seq_len: 4096, tokens_per_gpu: 4096}    # micro_batch 1
  - {seq_len: 4096, tokens_per_gpu: 8192}    # micro_batch 2 -- the 31B point
  - {seq_len: 4096, tokens_per_gpu: 16384}   # micro_batch 4
  - {seq_len: 4096, tokens_per_gpu: 32768}   # micro_batch 8
