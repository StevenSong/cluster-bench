# Correctness gate -- run this before trusting any timing number.
#
# Every sharding config must reproduce the same loss curve at a fixed seed on
# a real dataset. This is what catches packing-mask and loss-normalization
# bugs, which otherwise present as a config that is impressively fast and
# quietly wrong.
#
# The dataset and packing strategy are inherited rather than pinned here, so
# the gate exercises exactly the data path the timing matrices run. A gate on a
# path nothing else uses proves nothing.
#
# The step budget must match the matrix being gated, and this is not obvious:
# `dataset_num_samples: 0` sizes the corpus from warmup + measure steps, and
# HF's seeded RandomSampler permutes over the dataset length -- so a cell run at
# 0+60 walks a different batch order than the same cell at 20+80 and its loss
# curve is not comparable, even though the seed, the text and its order are all
# identical. It presents as every cell failing the gate by the same amount.
# report.check_loss_curves refuses the comparison rather than reporting it as a
# failure. Inherit the defaults here so these cells match 2A's.
#
# `warmup_steps` is a measurement-discard count, not an LR warmup, and the curve
# is logged from step 1 regardless -- so 2A's own runs already carry everything
# the gate needs, and this matrix is only for gating without a 2A sweep in hand.
#
# One pass per numerical family: the DDP cell updates bf16 weights in place and
# the DeepSpeed cells keep fp32 master weights, so their curves separate on
# arithmetic alone and report.py reports the cross-family cells as not gated
# rather than as failing. See "Reading the results" in README.md.
#
#   python -m cluster_bench.sweep configs/matrix/gate_correctness.yaml
#   python -m cluster_bench.report --reference ddp__full__t8192__s4096__gate
#   python -m cluster_bench.report --reference zero3__full__t8192__s4096__gate

defaults:
  seq_len: 4096
  micro_batch: 2
  packing: true
  completion_only_loss: true
  tag: gate

placements: [full]

strategies:
  - ddp
  - zero3
  - zero3-hpz4
  - zero3-hpz2
