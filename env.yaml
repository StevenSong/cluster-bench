name: cluster-bench
channels:
  - conda-forge
dependencies:
  - pip
  - python=3.12.13
  - pip:
    # Order matters: requirements.txt pins torch to the cu130 index. The
    # editable install carries no dependencies of its own (see pyproject.toml),
    # so it cannot re-resolve torch off PyPI and swap the bundled NCCL.
    - -r requirements.txt
    - -e .
