name: cluster-bench
channels:
  - conda-forge
dependencies:
  - pip
  - python=3.12.13
  - pip:
    # Order matters: requirements.txt pins torch to the cu130 index. The
    # editable install carries no dependencies of its own (see pyproject.toml),
    # so it cannot re-resolve torch off PyPI and swap the bundled NCCL.
    - -r requirements.txt
    - -e .
    # flash-attn is NOT here. It needs `--no-build-isolation`, which a
    # requirements file cannot carry, so it is one extra command after this
    # env is created -- on every node:
    #
    #     pip install -r requirements-flash.txt --no-build-isolation
    #
    # Packed sequences cross document boundaries and only flash-attention's
    # varlen path honours the boundary, so this is not optional for real-data
    # runs. See requirements-flash.txt.
